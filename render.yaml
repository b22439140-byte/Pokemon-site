services:
  - type: web
    name: pokevault
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PERSIST_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash
      - key: BUNQ_API_KEY
        sync: false
      - key: BUNQ_SANDBOX
        value: "false"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: BUNQ_MONETARY_ACCOUNT_ID
        sync: false
    disk:
      name: pokevault-data
      mountPath: /var/data
      sizeGB: 1
